$kind: http-request
description: Scambia client_id/client_secret per un token Admin API (24h). Il test salva `access_token` in `admin_token` e la scadenza in `admin_token_expires_at`; il campo `scope` della risposta è la verifica rapida degli scope effettivi dell'installazione.
url: https://{{store_domain}}/admin/oauth/access_token
method: POST
headers:
  Content-Type: application/x-www-form-urlencoded
body:
  type: urlencoded
  content:
    grant_type: client_credentials
    client_id: "{{client_id}}"
    client_secret: "{{client_secret}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("access_token presente", () => pm.expect(body.access_token).to.be.a("string").and.not.empty);
      // Shopify elenca solo lo scope più ampio concesso: write_products implica read_products.
      pm.test("scope copre products", () => pm.expect(body.scope || "").to.match(/(^|,)(read|write)_products(,|$)/));

      // Salva il token per le altre richieste (header X-Shopify-Access-Token a livello di collection).
      pm.environment.set("admin_token", body.access_token);
      pm.environment.set("admin_token_expires_at", String(Date.now() + (body.expires_in || 86400) * 1000));
      console.log("scope concessi:", body.scope);
    language: text/javascript
order: 1000
