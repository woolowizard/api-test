$kind: http-request
description: |-
  Step 1.1 a del documento: vocabolario colore. `metaobjectUpsert` è un upsert per costruzione, la chiave è la coppia `type` + `handle` (per questo `handle` è un `MetaobjectHandleInput`, non una stringa). Va eseguito prima di SetProductMetafields che referenzia il colore.

  L'handle è il codice colore del PIM (`color_code`) portato a lowercase dal pre-request script; il campo `code` conserva il valore originale. Il test salva il gid in `color_metaobject_id`, usato da SetProductMetafields nel metafield `aqz.color`.
url: https://{{store_domain}}/admin/api/{{api_version}}/graphql.json
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: ""
scripts:
  - type: beforeRequest
    code: |-
      // Gli handle Shopify ammettono solo minuscole, cifre e dash: il codice colore del PIM
      // (es. OPW) va normalizzato sempre nello stesso modo, altrimenti l'upsert crea doppioni.
      pm.variables.set("color_handle", String(pm.variables.get("color_code")).trim().toLowerCase());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      let body = {};
      try { body = pm.response.json(); } catch (e) { body = { errors: [{ message: "risposta non JSON: " + pm.response.text().slice(0, 300) }] }; }
      pm.test("nessun errore GraphQL", () => pm.expect(body.errors, JSON.stringify(body.errors)).to.be.undefined);
      const payload = (body.data && body.data.metaobjectUpsert) || {};
      pm.test("userErrors vuoto", () => pm.expect(payload.userErrors, JSON.stringify(payload.userErrors)).to.be.an("array").that.is.empty);
      pm.test("metaobject scritto con l'handle atteso", () => pm.expect(payload.metaobject && payload.metaobject.handle).to.eql(pm.variables.get("color_handle")));
      if (payload.metaobject) {
        pm.environment.set("color_metaobject_id", payload.metaobject.id);
        console.log("color_metaobject_id:", payload.metaobject.id, payload.metaobject.displayName);
      }
    language: text/javascript
order: 1000
