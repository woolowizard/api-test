$kind: http-request
description: |-
  Step 1.2 a del documento v1.5: scrive i soli campi nativi della colorway, identificata per `identifier.customId` (`aqz.model_color_sku`, tipo `id`). `input.metafields` va omesso sempre, anche per un solo campo custom: i metafield esistenti, incluso `aqz.colorways`, restano invariati.

  Semantica set su `productOptions` e `variants`: l'input porta tutte le taglie da mantenere, le altre vengono rimosse. `files`, `tags` e `collections` restano fuori da questa richiesta. `synchronous: true` per gli update on demand; il caricamento iniziale passa da Bulk operations.

  Il test salva `product_id` solo a risposta riuscita. Seguono SetProductMetafields per i campi custom e, se serve, DeleteProductMetafields. Cambiando `model_color_sku` vanno adattati anche title, handle e sku.
url: https://{{store_domain}}/admin/api/{{api_version}}/graphql.json
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: ""
scripts:
  - type: beforeRequest
    code: |-
      const fail = (message) => {
        console.error(message);
        if (pm.execution && pm.execution.setNextRequest) pm.execution.setNextRequest(null);
        if (pm.execution && pm.execution.skipRequest) pm.execution.skipRequest();
        throw new Error(message);
      };
      // Evita che una scrittura fallita lasci agli step custom il product_id del sync precedente.
      pm.environment.unset("product_id");
      const input = JSON.parse(pm.request.body.graphql.variables).input;
      if (Object.prototype.hasOwnProperty.call(input, "metafields")) {
        fail("SyncProduct deve omettere input.metafields: usa SetProductMetafields o DeleteProductMetafields");
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      let body = {};
      try { body = pm.response.json(); } catch (e) { body = { errors: [{ message: "risposta non JSON: " + pm.response.text().slice(0, 300) }] }; }
      pm.test("nessun errore GraphQL", () => pm.expect(body.errors, JSON.stringify(body.errors)).to.be.undefined);
      const payload = (body.data && body.data.productSet) || {};
      pm.test("userErrors vuoto", () => pm.expect(payload.userErrors, JSON.stringify(payload.userErrors)).to.be.an("array").that.is.empty);
      const product = payload.product || {};
      pm.test("product scritto", () => pm.expect(product.id).to.be.a("string"));
      pm.test("tutte le taglie dichiarate sono varianti (semantica set)", () => pm.expect((product.variants || { nodes: [] }).nodes.map((v) => v.sku).sort()).to.eql(["AANHIGP0-SFE-000350", "AANHIGP0-SFE-000360", "AANHIGP0-SFE-000370"]));
      if (pm.response.code !== 200 || body.errors || !Array.isArray(payload.userErrors) || payload.userErrors.length > 0 || !product.id) {
        if (pm.execution && pm.execution.setNextRequest) pm.execution.setNextRequest(null);
        return;
      }
      if (product.id) {
        pm.environment.set("product_id", product.id);
        console.log("product_id:", product.id, product.handle, product.status);
      }
    language: text/javascript
order: 4000
