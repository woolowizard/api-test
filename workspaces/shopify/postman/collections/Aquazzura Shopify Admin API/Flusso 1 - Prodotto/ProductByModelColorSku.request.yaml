$kind: http-request
description: |-
  Lettura di supporto, non nel documento: risolve la colorway dalla chiave naturale `aqz.model_color_sku` con `productByIdentifier(customId)`, senza passare dall'indice di ricerca (nessuna consistenza eventuale, a differenza di ColorwaysByStyle). Restituisce i gid che gli step successivi richiedono: product (SetColorways, Reorder, Translate), varianti, media della gallery, metafield `aqz.*` e opzioni con i loro valori (risorse traducibili separate dal product).

  Il test salva `product_id` e `media_ids` (gallery corrente, base della lista completa di AttachMedia) e stampa i gid dei metafield da usare come `translatable_resource_id`.
url: https://{{store_domain}}/admin/api/{{api_version}}/graphql.json
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      let body = {};
      try { body = pm.response.json(); } catch (e) { body = { errors: [{ message: "risposta non JSON: " + pm.response.text().slice(0, 300) }] }; }
      pm.test("nessun errore GraphQL", () => pm.expect(body.errors, JSON.stringify(body.errors)).to.be.undefined);
      const product = body.data && body.data.productByIdentifier;
      pm.test("product trovato per aqz.model_color_sku = " + pm.variables.get("model_color_sku"), () => pm.expect(product).to.not.be.null);
      if (!product) return;
      pm.environment.set("product_id", product.id);
      pm.environment.set("media_ids", JSON.stringify(product.media.nodes.map((m) => m.id)));
      console.log("product_id:", product.id, product.handle, product.status);
      console.log("media_ids:", JSON.stringify(product.media.nodes.map((m) => m.id)));
      console.log("metafield aqz (gid per Translate):", product.metafields.nodes.map((m) => m.key + " = " + m.id).join("\n"));
      console.log("opzioni (gid per Translate):", JSON.stringify(product.options.map((o) => ({ id: o.id, name: o.name, values: o.optionValues }))));
    language: text/javascript
order: 7000
