$kind: http-request
description: |-
  Lettura di supporto, non nel documento. I metafield `aqz.color` e `aqz.size_guide` sono `metaobject_reference` e accettano solo il gid del metaobject, mai l'handle: DataNext lo ha dalla risposta di metaobjectUpsert oppure lo ricava da questa query per chiave naturale (`type` + `handle`).

  Il test salva `color_metaobject_id` e `size_guide_metaobject_id`. SetProductMetafields risolve nel pre-request i riferimenti richiesti dal batch che mancano nell'environment.
url: https://{{store_domain}}/admin/api/{{api_version}}/graphql.json
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: ""
scripts:
  - type: beforeRequest
    code: |-
      // Gli handle Shopify ammettono solo minuscole, cifre e dash: il codice colore del PIM
      // (es. OPW) va normalizzato sempre nello stesso modo, altrimenti l'upsert crea doppioni.
      pm.variables.set("color_handle", String(pm.variables.get("color_code")).trim().toLowerCase());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      let body = {};
      try { body = pm.response.json(); } catch (e) { body = { errors: [{ message: "risposta non JSON: " + pm.response.text().slice(0, 300) }] }; }
      pm.test("nessun errore GraphQL", () => pm.expect(body.errors, JSON.stringify(body.errors)).to.be.undefined);
      // "data" è un global riservato del sandbox Postman (iteration data): non ridichiararlo.
      const result = body.data || {};
      pm.test("metaobject color trovato", () => pm.expect(result.color, "color " + pm.variables.get("color_handle") + " assente: lancia UpsertColor").to.not.be.null);
      pm.test("metaobject size_guide trovato", () => pm.expect(result.sizeGuide, "size_guide " + pm.variables.get("size_guide_handle") + " assente: lancia UpsertSizeGuide").to.not.be.null);
      if (result.color) pm.environment.set("color_metaobject_id", result.color.id);
      if (result.sizeGuide) pm.environment.set("size_guide_metaobject_id", result.sizeGuide.id);
      console.log("color:", result.color && result.color.id, "size_guide:", result.sizeGuide && result.sizeGuide.id);
    language: text/javascript
order: 3000
