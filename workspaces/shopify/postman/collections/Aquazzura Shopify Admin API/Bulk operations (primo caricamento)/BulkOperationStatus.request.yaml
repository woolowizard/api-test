$kind: http-request
description: |-
  Passo 4 di 5: polling dello stato dell'ultima bulk mutation dello shop (`CREATED`, `RUNNING`, `COMPLETED`, `FAILED`, `CANCELED`, `EXPIRED`). A COMPLETED `url` punta al JSONL dei risultati (una riga per riga di input, nello stesso ordine) e `objectCount` conta gli oggetti processati; `partialDataUrl` è disponibile in caso di FAILED. `errorCode` distingue ACCESS_DENIED, INTERNAL_SERVER_ERROR e TIMEOUT.

  Il test salva `bulk_result_url`; nel Collection Runner ripete la richiesta ogni 5 secondi finché l'operazione è in corso.
url: https://{{store_domain}}/admin/api/{{api_version}}/graphql.json
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      let body = {};
      try { body = pm.response.json(); } catch (e) { body = { errors: [{ message: "risposta non JSON: " + pm.response.text().slice(0, 300) }] }; }
      pm.test("nessun errore GraphQL", () => pm.expect(body.errors, JSON.stringify(body.errors)).to.be.undefined);
      const op = body.data && body.data.currentBulkOperation;
      pm.test("bulk operation presente", () => pm.expect(op, "nessuna bulk mutation su questo shop").to.not.be.null);
      if (!op) return;
      console.log(op.id, op.status, "oggetti:", op.objectCount, "errorCode:", op.errorCode);
      pm.test("operazione non fallita", () => pm.expect(op.status, op.errorCode).to.not.be.oneOf(["FAILED", "CANCELED", "EXPIRED"]));

      const setNext = (name) => (pm.execution && pm.execution.setNextRequest ? pm.execution.setNextRequest(name) : postman.setNextRequest(name));
      if (op.status === "CREATED" || op.status === "RUNNING") {
        const attempts = Number(pm.variables.get("bulk_status_attempts") || 0) + 1;
        if (attempts > 60) throw new Error("bulk operation ancora in corso dopo " + attempts + " tentativi (5 minuti)");
        pm.variables.set("bulk_status_attempts", attempts);
        console.log("in corso, nuovo tentativo " + attempts + "/60 fra 5 s");
        setTimeout(() => setNext("BulkOperationStatus"), 5000);
      } else {
        pm.variables.set("bulk_status_attempts", 0);
        if (op.status === "COMPLETED") {
          pm.environment.set("bulk_result_url", op.url);
          console.log("bulk_result_url salvata:", op.url);
        }
      }
    language: text/javascript
order: 4000
