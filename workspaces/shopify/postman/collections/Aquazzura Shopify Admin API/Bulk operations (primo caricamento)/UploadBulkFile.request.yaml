$kind: http-request
description: |-
  Passo 2 di 5: carica il JSONL sul target firmato, in multipart/form-data. Non è una chiamata Admin API: nessun header `X-Shopify-Access-Token`, i campi del form sono i `parameters` restituiti da StagedUploadForBulk (policy e firma) e il campo `file` deve essere l'ultimo. Il pre-request ricostruisce il form da `staged_upload_params` e mantiene `file` in coda.

  Il file di esempio è `postman/samples/products.jsonl` (due colorway Alana Pump 105, una per riga): il percorso è relativo alla working directory di Postman (Settings > General > Working directory), da puntare sulla cartella `postman/` del repo, oppure si seleziona il file a mano nel campo. Risposta attesa: `201 Created` (XML) dallo storage.
url: "{{staged_upload_url}}"
method: POST
body:
  type: formdata
  content:
    - type: file
      key: file
      src:
        - samples/products.jsonl
      description: 'JSONL: una riga per productSet con le variabili { "id": ..., "input": ... }. Ultimo campo del form.'
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      const fail = (message) => { console.error(message); if (pm.execution && pm.execution.skipRequest) pm.execution.skipRequest(); fail(message); };
      // Ricostruisce i campi del form con i parameters firmati; il campo file deve restare ultimo (requisito dello storage).
      let params = null;
      try { params = JSON.parse(pm.variables.get("staged_upload_params") || "null"); } catch (e) { params = null; }
      if (!params || !pm.variables.get("staged_upload_url")) fail("manca staged_upload_params: lancia prima StagedUploadForBulk");

      const formdata = pm.request.body.formdata;
      const fileField = formdata.find((p) => p.type === "file") || formdata.find((p) => p.key === "file");
      const fileJson = fileField ? fileField.toJSON() : { key: "file", type: "file", src: "samples/products.jsonl" };
      formdata.clear();
      params.forEach((p) => formdata.add({ key: p.name, value: p.value, type: "text" }));
      formdata.add(fileJson);
      console.log("form: " + params.map((p) => p.name).join(", ") + ", file (" + (fileJson.src || "nessun file selezionato") + ")");
    language: text/javascript
  - type: afterResponse
    code: pm.test("upload accettato dallo storage (201)", () => pm.expect(pm.response.code, pm.response.text()).to.be.oneOf([200, 201, 204]));
    language: text/javascript
order: 2000
