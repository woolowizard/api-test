$kind: http-request
description: |-
  Passo 5 di 5: scarica il JSONL dei risultati dalla URL firmata (valida 7 giorni, nessun token Shopify). Ogni riga porta `data.productSet` con `product` e `userErrors` della riga di input corrispondente e `__lineNumber`: la verifica va fatta riga per riga, perché la bulk operation risulta COMPLETED anche se singole righe sono state rifiutate.

  Il test conta le righe con `userErrors` e le stampa in console.
url: "{{bulk_result_url}}"
method: GET
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      const fail = (message) => { console.error(message); if (pm.execution && pm.execution.skipRequest) pm.execution.skipRequest(); fail(message); };
      if (!pm.variables.get("bulk_result_url")) fail("manca bulk_result_url: lancia BulkOperationStatus fino a COMPLETED");
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      const rows = pm.response.text().trim().split("\n").filter(Boolean).map((line) => JSON.parse(line));
      const failed = rows.filter((r) => r.data && r.data.productSet && r.data.productSet.userErrors && r.data.productSet.userErrors.length > 0);
      console.log(rows.length + " righe, " + failed.length + " con userErrors");
      failed.forEach((r) => console.warn("riga " + r.__lineNumber + ":", JSON.stringify(r.data.productSet.userErrors)));
      pm.test("nessuna riga con userErrors", () => pm.expect(failed, JSON.stringify(failed.map((r) => r.__lineNumber))).to.be.empty);
      pm.test("nessuna riga con errors", () => rows.forEach((r) => pm.expect(r.errors, JSON.stringify(r.errors)).to.be.undefined));
    language: text/javascript
order: 5000
