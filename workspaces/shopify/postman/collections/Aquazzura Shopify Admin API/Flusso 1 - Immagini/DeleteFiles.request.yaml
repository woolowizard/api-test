$kind: http-request
description: |-
  Aggiornamento di un asset (step 1.4): Shopify non sostituisce il binario di un file esistente, quindi la sequenza è IngestImages del nuovo, AttachMedia con la gallery che contiene il nuovo al posto del vecchio, DeleteFiles del vecchio. Richiede il mapping persistito `assetId Thron` verso `fileId Shopify` nel DB DataNext.

  L'esempio cancella `old_file_id`, da impostare a mano nell'environment: non ha fallback per evitare cancellazioni involontarie.
url: https://{{store_domain}}/admin/api/{{api_version}}/graphql.json
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: ""
scripts:
  - type: beforeRequest
    code: |-
      const fail = (message) => { console.error(message); if (pm.execution && pm.execution.skipRequest) pm.execution.skipRequest(); fail(message); };
      if (!pm.variables.get("old_file_id")) fail("manca old_file_id: va impostato a mano nell'environment (gid del file da cancellare)");
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      let body = {};
      try { body = pm.response.json(); } catch (e) { body = { errors: [{ message: "risposta non JSON: " + pm.response.text().slice(0, 300) }] }; }
      pm.test("nessun errore GraphQL", () => pm.expect(body.errors, JSON.stringify(body.errors)).to.be.undefined);
      const payload = (body.data && body.data.fileDelete) || {};
      pm.test("userErrors vuoto", () => pm.expect(payload.userErrors, JSON.stringify(payload.userErrors)).to.be.an("array").that.is.empty);
      pm.test("file cancellato", () => pm.expect(payload.deletedFileIds || []).to.include(pm.variables.get("old_file_id")));
    language: text/javascript
order: 6000
