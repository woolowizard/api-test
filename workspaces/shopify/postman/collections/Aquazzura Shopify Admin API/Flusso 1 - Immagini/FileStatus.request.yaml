$kind: http-request
description: |-
  Step 1.4 b del documento: polling dello stato di processing (`UPLOADED`, `PROCESSING`, `READY`, `FAILED`) con la query `nodes`, fino a READY oppure FAILED (retry o alert; `fileErrors` spiega la causa). Solo i file READY si agganciano al product.

  L'esempio interroga il solo `file_id` salvato da IngestImages; `nodes` accetta fino a 250 id. Nel Collection Runner il test ripete la richiesta ogni 3 secondi finché il file resta in processing (massimo 20 tentativi).
url: https://{{store_domain}}/admin/api/{{api_version}}/graphql.json
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: ""
scripts:
  - type: beforeRequest
    code: |-
      const fail = (message) => { console.error(message); if (pm.execution && pm.execution.skipRequest) pm.execution.skipRequest(); fail(message); };
      if (!pm.variables.get("file_id")) fail("manca file_id: lancia prima IngestImages");
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      let body = {};
      try { body = pm.response.json(); } catch (e) { body = { errors: [{ message: "risposta non JSON: " + pm.response.text().slice(0, 300) }] }; }
      pm.test("nessun errore GraphQL", () => pm.expect(body.errors, JSON.stringify(body.errors)).to.be.undefined);
      const nodes = ((body.data && body.data.nodes) || []).filter(Boolean);
      pm.test("file trovato", () => pm.expect(nodes).to.not.be.empty);
      pm.test("nessun file FAILED", () => nodes.forEach((n) => pm.expect(n.fileStatus, n.id + " " + JSON.stringify(n.fileErrors)).to.not.eql("FAILED")));
      nodes.forEach((n) => console.log(n.id, n.fileStatus, n.image ? n.image.url : ""));

      // Nel Runner: ripete finché ogni file è READY o FAILED (processing asincrono).
      const pending = nodes.filter((n) => n.fileStatus !== "READY" && n.fileStatus !== "FAILED");
      const setNext = (name) => (pm.execution && pm.execution.setNextRequest ? pm.execution.setNextRequest(name) : postman.setNextRequest(name));
      if (pending.length > 0) {
        const attempts = Number(pm.variables.get("file_status_attempts") || 0) + 1;
        if (attempts > 20) throw new Error("file ancora in processing dopo " + attempts + " tentativi");
        pm.variables.set("file_status_attempts", attempts);
        console.log("in processing: " + pending.map((n) => n.fileStatus).join(", ") + ", nuovo tentativo " + attempts + "/20 fra 3 s");
        setTimeout(() => setNext("FileStatus"), 3000);
      } else {
        pm.variables.set("file_status_attempts", 0);
      }
    language: text/javascript
order: 2000
