$kind: http-request
description: |-
  Step 1.4 a del documento: registra i file passando come sorgente gli URL pubblici Thron (massima risoluzione, nessun resize); è Shopify a scaricarli e processarli in asincrono. La risposta è "riuscita" anche con sorgente irraggiungibile: il file passa a FAILED solo dopo, quindi segue sempre FileStatus.

  `filename` deve avere un'estensione identica a quella della `originalSource`, altrimenti `MISMATCHED_FILENAME_AND_ORIGINAL_SOURCE`: il pre-request lo verifica prima di inviare. Con lo stesso `filename` già presente Shopify aggiunge un suffisso (default `APPEND_UUID`). L'esempio ingerisce un solo file (l'input accetta fino a 250) da un'immagine campione pubblica di Shopify, da sostituire con un URL Thron in `image_source_url`. Il test salva `file_id`.

  Scope: `write_files` (l'app di organizzazione oggi non lo ha: la risposta è un errore "Access denied for fileCreate").
url: https://{{store_domain}}/admin/api/{{api_version}}/graphql.json
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: ""
scripts:
  - type: beforeRequest
    code: |-
      const fail = (message) => { console.error(message); if (pm.execution && pm.execution.skipRequest) pm.execution.skipRequest(); fail(message); };
      // L'estensione di filename deve coincidere con quella della originalSource (MISMATCHED_FILENAME_AND_ORIGINAL_SOURCE).
      const ext = (s) => ((String(s).split("?")[0].match(/\.([a-z0-9]+)$/i) || [])[1] || "").toLowerCase();
      const source = pm.variables.get("image_source_url");
      const filename = pm.variables.get("image_filename");
      if (!ext(filename) || ext(filename) !== ext(source)) {
        fail("image_filename (" + filename + ") deve avere la stessa estensione di image_source_url (" + source + ")");
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      let body = {};
      try { body = pm.response.json(); } catch (e) { body = { errors: [{ message: "risposta non JSON: " + pm.response.text().slice(0, 300) }] }; }
      pm.test("nessun errore GraphQL", () => pm.expect(body.errors, JSON.stringify(body.errors)).to.be.undefined);
      const payload = (body.data && body.data.fileCreate) || {};
      pm.test("userErrors vuoto", () => pm.expect(payload.userErrors, JSON.stringify(payload.userErrors)).to.be.an("array").that.is.empty);
      const files = payload.files || [];
      pm.test("un file registrato", () => pm.expect(files).to.have.lengthOf(1));
      if (files[0]) {
        pm.environment.set("file_id", files[0].id);
        console.log("file_id:", files[0].id, "fileStatus:", files[0].fileStatus, "(pollare con FileStatus fino a READY)");
      }
    language: text/javascript
order: 1000
