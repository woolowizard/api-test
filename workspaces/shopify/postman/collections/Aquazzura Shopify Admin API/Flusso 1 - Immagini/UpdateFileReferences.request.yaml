$kind: http-request
description: |-
  Correzione puntuale dello step 1.4 c: aggancia o stacca un singolo file senza riscrivere la gallery, con `referencesToAdd` / `referencesToRemove` (gid di product). Non è il passo del flusso standard, che resta AttachMedia a lista completa; serve anche a rinominare l'`alt`.

  L'esempio aggancia `file_id` a `product_id`: se il file è già nella gallery Shopify risponde con un userError.
url: https://{{store_domain}}/admin/api/{{api_version}}/graphql.json
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: ""
scripts:
  - type: beforeRequest
    code: |-
      const fail = (message) => { console.error(message); if (pm.execution && pm.execution.skipRequest) pm.execution.skipRequest(); fail(message); };
      ["product_id", "file_id"].forEach((k) => { if (!pm.variables.get(k)) fail("manca " + k); });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      let body = {};
      try { body = pm.response.json(); } catch (e) { body = { errors: [{ message: "risposta non JSON: " + pm.response.text().slice(0, 300) }] }; }
      pm.test("nessun errore GraphQL", () => pm.expect(body.errors, JSON.stringify(body.errors)).to.be.undefined);
      const payload = (body.data && body.data.fileUpdate) || {};
      pm.test("userErrors vuoto", () => pm.expect(payload.userErrors, JSON.stringify(payload.userErrors)).to.be.an("array").that.is.empty);
      pm.test("file aggiornato", () => pm.expect(payload.files || []).to.have.lengthOf(1));
    language: text/javascript
order: 5000
