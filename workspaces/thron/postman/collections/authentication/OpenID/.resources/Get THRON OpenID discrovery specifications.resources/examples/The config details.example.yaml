$kind: http-example
request:
  url: "{{baseUrl}}/authentication/.well-known/openid-configuration"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
