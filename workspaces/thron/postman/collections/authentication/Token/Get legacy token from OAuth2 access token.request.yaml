$kind: http-request
description: Get legacy token from OAuth2 access token
url: "{{baseUrl}}/authentication/token/legacy?username=string"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: username
    value: string
    description: The username the legacy token is for
auth:
  type: noauth
examples: ./.resources/Get legacy token from OAuth2 access token.resources/examples
order: 2000
