$kind: http-request
description: Get access token information
url: "{{baseUrl}}/authentication/token/introspect"
method: POST
headers:
  Content-Type: application/x-www-form-urlencoded
  Accept: application/json
body:
  type: urlencoded
  content:
    - key: token
      value: string
      description: The token to introspect
examples: ./.resources/Get access token information.resources/examples
order: 1000
