$kind: http-example
request:
  url: "{{baseUrl}}/authentication/token/legacy?username=string"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: username
      value: string
      description: The username the legacy token is for
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: "{\r\n  \"token\": \"string\"\r\n}"
order: 1000
