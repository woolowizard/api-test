$kind: http-example
request:
  url: "{{baseUrl}}/authentication/token/introspect"
  method: POST
  headers:
    Content-Type: application/x-www-form-urlencoded
    Accept: application/json
  body:
    type: urlencoded
    content:
      - key: token
        value: string
        description: The token to introspect
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
          "active": false,
          "capabilities": [
              "string",
              "string"
          ],
          "client_id": "string",
          "exp": 2208,
          "roles": [
              "string",
              "string"
          ],
          "scope": "string",
          "username": "string"
      }
order: 1000
