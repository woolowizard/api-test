  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: "{\r

      \  \"status\": 8177,\r

      \  \"title\": \"string\",\r

      \  \"violations\": [\r

      \    {\r

      \      \"message\": \"MyAttribute must be longer than 50\",\r

      \      \"field\": \"MyAttribute\"\r

      \    },\r

      \    {\r

      \      \"message\": \"MyAttribute must be longer than 50\",\r

      \      \"field\": \"MyAttribute\"\r

      \    }\r

      \  ]\r

      }"
order: 3000
