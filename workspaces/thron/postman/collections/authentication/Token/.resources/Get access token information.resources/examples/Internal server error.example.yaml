$kind: http-example
request:
  url: "{{baseUrl}}/authentication/token/introspect"
  method: POST
  headers:
    Content-Type: application/x-www-form-urlencoded
    Accept: application/json
  body:
    type: urlencoded
    content:
      - key: token
        value: string
        description: The token to introspect
