$kind: http-example
request:
  url: "{{baseUrl}}/authentication/oauth2/token"
  method: POST
  headers:
    Content-Type: application/x-www-form-urlencoded
    Accept: application/json
  body:
    type: urlencoded
    content:
      - key: client_id
        value: string
        description: Application identification key. Is an id generated during application registration. Must be requested to the THRON support team.
      - key: client_secret
        value: string
        description: The `clientSecret` of the application. It is an application password. It must be requested to the THRON support team.
      - key: grant_type
        value: client_credentials
        description: Grant types are ways for applications to obtain Access Tokens, allowing them to access your resources in a limited way without revealing your login credentials.
      - key: subject
        value: string
        description: "Username of the user to impersonate. It is used together with the `client_id` and `client_secret`. To be entered only when `grant_type: urn:thron:oauth:user-impersonation`."
      - key: username
        value: string
        description: User’s username, the one they use to access THRON. To be entered only when `grant_type:password`.
      - key: password
        value: string
        description: User’s password, the one they use to access THRON. To be entered only when `grant_type:password`.
      - key: scope
        value: phone
        description: "Specific types of information an application can request. Currently, only the "
      - key: refresh_token
        value: string
        description: Is a token paired with a JWT, allowing you to get a new JWT without redoing the authorization process.
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": 8177,
        "title": "string",
        "violations": [
          {
            "message": "MyAttribute must be longer than 50",
            "field": "MyAttribute"
          },
          {
            "message": "MyAttribute must be longer than 50",
            "field": "MyAttribute"
          }
        ]
      }
order: 2000
