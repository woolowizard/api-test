$kind: http-request
description: Revoke a refresh token
url: "{{baseUrl}}/authentication/oauth2/revoke"
method: POST
headers:
  Content-Type: application/x-www-form-urlencoded
  Accept: application/json
body:
  type: urlencoded
  content:
    - key: token
      value: string
      description: The refresh token to revoke
    - key: token_type_hint
      value: refresh_token
      description: The token type provided (only 'refresh_token' supported)
examples: ./.resources/Revoke a refresh token.resources/examples
order: 3000
