$kind: http-request
description: |-
  Updates one or more attributes on a product without affecting attributes not mentioned in the request.

  Unlike `PUT /products/{id}` (full replacement), this endpoint only modifies the attributes you specify. Attributes NOT included in the request body remain unchanged on the product.

  **How values are applied:**

  - Each entry in the `attributes` array specifies one attribute value (optionally for a specific locale).
      
  - If you provide a value, it overwrites the existing value for that attribute+locale combination.
      
  - If you provide an entry with ONLY `code` (and optionally `locale`) but NO value field, the existing value for that attribute+locale is **deleted**.
      

  **Example — update one attribute and delete another:**

  ```
  {"attributes": [
  {"code": "price", "number": 29.99},
  {"code": "old_description", "locale": "en-GB"}
  ]}

   ```

  This sets price to 29.99 and removes the en-GB value of old_description.

  **Attribute rights:** You can only modify attributes where your resolved right is `CAN_MODIFY`. Attempting to update an attribute with `CAN_SEE` (read-only) or `RESTRICTED` (hidden) rights returns HTTP 403. Attributes not mentioned in the request are unaffected regardless of your rights on them.
url: "{{baseUrl}}/product-data/products/:id/attributes"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: string
    description: Product technical ID (UUID) or identifier in format {attributeCode}:{value}. URL-encode if value contains / + or spaces.
body:
  type: json
  content: |-
    //Attribute values to set or delete. Entries with a value field overwrite; entries with only code (and locale) delete the existing value.
    {
        "attributes": [
            {
                "boolean": true,
                "code": "example_attribute-1",
                "identifier": "my-product-unique-1",
                "locale": "string",
                "longText": "Example of long text.",
                "mediaGallery": [
                    "string"
                ],
                "multiSelect": [
                    "string"
                ],
                "number": 104.015,
                "productReference": [
                    "string"
                ],
                "shortText": "Example of short text.",
                "simpleSelect": "string"
            }
        ]
    }
examples: ./.resources/Partially update multiple attributes on a product.resources/examples
order: 9000
