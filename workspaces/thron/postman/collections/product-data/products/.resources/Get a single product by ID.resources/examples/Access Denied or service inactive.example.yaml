$kind: http-example
request:
  url: "{{baseUrl}}/products/:id?showInheritedAttributes=true"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  queryParams:
    - key: showInheritedAttributes
      value: "true"
      description: Whether to show the inherited attributes of the product
  pathVariables:
    id: ""
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": 0,
        "title": "",
        "code": ""
      }
order: 3000
