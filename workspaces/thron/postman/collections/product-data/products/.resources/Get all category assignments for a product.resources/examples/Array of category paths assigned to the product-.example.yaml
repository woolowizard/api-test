$kind: http-example
name: Array of category paths assigned to the product.
request:
  url: "{{baseUrl}}/products/:id/assets"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    id: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "items": [
          "catalog1 > cat1",
          "catalog2 > cat1 > cat2"
        ]
      }
order: 1000
