$kind: http-example
name: Unexpected internal error. Contact support if the issue persists.
request:
  url: "{{baseUrl}}/products/:id/assets"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    id: ""
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "",
        "status": 0,
        "title": ""
      }
order: 6000
