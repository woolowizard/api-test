$kind: http-example
name: The Authorization header is missing, malformed, or the API key/token has expired.
request:
  url: "{{baseUrl}}/products/:id/assets"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    id: ""
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "",
        "status": 0,
        "title": ""
      }
order: 2000
