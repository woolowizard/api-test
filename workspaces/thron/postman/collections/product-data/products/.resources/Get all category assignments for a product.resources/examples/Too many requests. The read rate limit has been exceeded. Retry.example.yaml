$kind: http-example
name: Too many requests. The read rate limit has been exceeded. Retry after a short delay.
request:
  url: "{{baseUrl}}/products/:id/assets?assetIds=string,string&cursor=string&limit=100"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  queryParams:
    - key: assetIds
      value: string,string
      description: "The asset ids. Note: The system accepts unique technical id or the prettyid or even the externalId that consists of a key field and a value separated by a colon (id: :). The value only could be not unique, so the user can specify the identification label on the key field. A maximum of 100 assets can be requested."
    - key: cursor
      value: string
      description: "Pointer to the next page to retrieve. The value to be used could be found on the "
    - key: limit
      value: "100"
      description: The page size limit
  pathVariables:
    id: ""
response:
  statusCode: 429
  statusText: Too Many Requests
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "",
        "status": 0,
        "title": ""
      }
order: 5000
