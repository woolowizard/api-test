$kind: http-example
request:
  url: "{{baseUrl}}/products?multiValSeparator=string&ids=string,string&attributeFields=string,string&familyIds=string,string&variationIds=string,string&contentId=string&cursor=string&limit=100&showInheritedAttributes=true"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  queryParams:
    - key: multiValSeparator
      value: string
      description: The separator character used to split values on multi-value filters. The character must be different from any other character used in the filter values. Default to ',' if not specified.
    - key: ids
      value: string,string
      description: "The product ids. Note: The system accepts the technical id or the identifier with format {code}:{identifier_value}. identifier_value evaluation is case-insensitive. In case of identifier within /, + or space characters, the value in query params must be urlencoded. i.e.: product_id:A2/TEXT+ TEXT-B1/TEXT has to be passed as product_id%3AA2%2FTEXT%2B%20TEXT-B1%2FTEXT. A maximum of 100 attributes can be requested."
    - key: attributeFields
      value: string,string
      description: "Attribute fields to be added to the default base set (ID, createdAt, lastModifiedAt, family) as an extension. Please note: a maximum of 10 attributes can be requested."
    - key: familyIds
      value: string,string
      description: The family codes used to filter the results.
    - key: variationIds
      value: string,string
      description: The variation codes used to filter the results.
    - key: contentId
      value: string
      description: The content id used to filter the results
    - key: cursor
      value: string
      description: Pointer to the next page to retrieve. The value to be used can be found on the 'next' attribute in the response of a previous call.
    - key: limit
      value: "100"
      description: The page size limit
    - key: showInheritedAttributes
      value: "true"
      description: Whether to show the inherited attributes (if there are such codes in attributeFields) of the filtered products
