$kind: http-example
name: "Validation failed. Common causes: attribute code in body doesn't match attributeId in URL, invalid value for the attribute type, invalid option code, or referencing non-existent content/product."
request:
  url: "{{baseUrl}}/products/:id/attributes/:attributeId"
  method: PUT
  headers:
