$kind: http-request
description: |-
  Replaces ALL attributes of an existing product with the provided set.

  ⚠️ **This is a full replacement, NOT a partial update.** The value of any attribute not included in the request body will be DELETED. If you only want to update specific attributes without affecting others, use `PUT /products/{id}/attributes` (partial update) instead.

  The product is identified by the `id` path parameter, which can be:

  - A **technical ID** (UUID assigned by the system at creation)
      
  - An **identifier** in the format `{attributeCode}:{identifierValue}` (case-insensitive on value)
      

  If the identifier value contains special characters (`/`, `+`, spaces), it must be URL-encoded.

  The request body must include at least the IDENTIFIER attribute (the product's unique identifier). For model-variant children products (VARIATION-GROUP, VARIANT), axis attribute values must be included as well.

  **Attribute rights and full replacement:** You can only provide values for attributes where your resolved right is `CAN_MODIFY`. Attempting to write (or delete, bu not including it anymore) an attribute with `CAN_SEE` or `RESTRICTED` rights returns HTTP 403.
url: "{{baseUrl}}/product-data/products/:id"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: sku:PLMEYES0-ANM
    description: Product technical ID (UUID) or identifier in format {attributeCode}:{value}. URL-encode if value contains / + or spaces.
body:
  type: json
  content: |-
    //Complete set of attributes for the product. Attributes NOT listed here will be removed. Must include the IDENTIFIER attribute and axis attribute value (if product is not SIMPLE/MASTER).
    {
        "attributes": [
            {
                "code": "sku",
                "identifier": "PLMEYES0-ANM"
            },
            {
                "code": "erp_category",
                "simpleSelect": "060"
            },
            {
                "code": "erp_macrocategory",
                "simpleSelect": "eyew"
            },
            {
                "code": "erp_name",
                "shortText": "PALM BEACH"
            },
            {
                "code": "gender",
                "simpleSelect": "w"
            },
            {
                "code": "erp_material_code",
                "simpleSelect": "anm"
            },
            {
                "code": "erp_model_code",
                "shortText": "PLMEYES0"
            },
            {
                "code": "set_erp",
                "number": 1
            },
            {
                "code": "erp_height",
                "number": 0
            },
            {
                "code": "erp_length",
                "number": 0
            },
            {
                "code": "erp_width",
                "number": 0
            }
        ]
    }
examples: ./.resources/Full replacement of a product's attributes.resources/examples
order: 7000
