$kind: http-request
description: |-
  Retrieves the list of all category paths currently assigned to this product.

  Each item is a full path from catalog root to leaf, using " > " as separator.
url: "{{baseUrl}}/product-data/products/:id/assets"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: string
    description: Product technical ID (UUID) or identifier in format {attributeCode}:{value}.
examples: ./.resources/Get all category assignments for a product.resources/examples
order: 11000
