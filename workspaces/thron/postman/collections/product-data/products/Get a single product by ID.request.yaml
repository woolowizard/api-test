$kind: http-request
description: |-
  Retrieves a single product with all its attribute values.

  The product is identified by the `id` path parameter, which can be:

  - A **technical ID** (UUID assigned by the system at creation)
      
  - A **identifier** in the format `{attributeCode}:{value}` (case-insensitive on value)
      

  If the identifier value contains special characters (`/`, `+`, spaces), it must be URL-encoded.

  **Inheritance:** For products in a model-variant hierarchy (VARIATION-GROUP or VARIANT), the response includes only the product's own attributes by default.  
  Set `showInheritedAttributes=true` to also include attribute values inherited from ancestor products (MASTER or VARIATION-GROUP).  
  Inherited attributes are marked with `"inherited": true` in the response.

  **Expansions:** Use the `expand` query parameter to include additional related data:

  - `categories` — includes the full category tree paths the product is assigned to
      
  - `siblings` — includes axis value combinations of sibling products
      

  **Attribute rights:** The response is filtered based on the authenticated user's attribute rights.  
  Attributes with `RESTRICTED` right are silently removed from the response — they will not appear in `attributes` or `inheritedAttributes`.  
  Attributes with `CAN_SEE` or `CAN_MODIFY` are always included.
url: "{{baseUrl}}/product-data/products/:id?showInheritedAttributes=true"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: showInheritedAttributes
    value: "true"
    description: "If true and the product is a VARIANT or VARIATION-GROUP, also returns attribute values inherited from ancestor products. Inherited attributes are marked with 'inherited: true'. Default: false."
  - key: expand
    value: string,string
    disabled: true
    description: "Comma-separated list of additional data to include. Supported: 'categories' (adds category tree paths), 'siblings' (adds sibling variant axis values for building variant selectors)."
pathVariables:
  - key: id
    value: sku:CCMSHBS0-BSS-PLY
    description: Product technical ID (UUID) or identifier in format {attributeCode}:{value}. URL-encode if value contains / + or spaces.
examples: ./.resources/Get a single product by ID.resources/examples
order: 6000
