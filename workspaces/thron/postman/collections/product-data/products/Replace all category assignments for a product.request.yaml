$kind: http-request
description: |-
  Replaces the entire set of categories assigned to a product.

  Categories are hierarchical classification paths used to organize products in a catalog tree. A product can be assigned to multiple categories across different catalogs.

  ⚠️ This is a full replacement: any category not listed in the request will be removed from the product. To add a category without removing existing ones, first GET the current categories, then PUT the merged list.

  **Path format:** Each category path uses `>` as the level separator. The first segment is always the catalog code.
url: "{{baseUrl}}/product-data/products/:id/categories"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  id: string
body:
  type: json
  content: |-
    //Array of category paths to assign. Each path starts with a catalog code followed by category segments separated by '>'.
    {
      "items": [
        "catalog1>cat1",
        "catalog2>cat1>cat2"
      ]
    }
examples: ./.resources/Replace all category assignments for a product.resources/examples
order: 12000
