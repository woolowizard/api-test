$kind: http-request
description: |-
  Replaces ALL values (across all locales) of a single attribute on a product, leaving all other attributes untouched.

  Use this endpoint when you want to overwrite all locale values (or the non-localized value) for ONE specific attribute.

  **How it works:**

  - The `attributeId` in the URL path specifies which attribute code to update.
      
  - The request body contains the new values for that attribute. ALL values in the body must have the SAME `code` matching `attributeId`.
      
  - Existing values for this attribute are completely replaced by the new values (all locales, meaning that non-specified localized values will be deleted). Other attributes on the product are NOT affected.
      

  **Example:** Update the "description" attribute in English and Italian, remove "name" attribute:

  ```
  {"attributes": [
  {"code": "description", "longText": "New EN description", "locale": "en-GB"},
  {"code": "description", "longText": "Nuova descrizione IT", "locale": "it-IT"},
  {"code": "name"}
  ]}

   ```

  **Attribute rights:** The target attribute must have `CAN_MODIFY` right for the authenticated user. If the attribute is `CAN_SEE` (read-only) or `RESTRICTED` (hidden), the request returns HTTP 403.
url: "{{baseUrl}}/product-data/products/:id/attributes/:attributeId"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  id: string
  attributeId: string
body:
  type: json
  content: |-
    //New values for the attribute. All entries must have the same 'code' matching the attributeId path parameter. Replaces all existing locale values for this attribute.
    {
      "attributes": [
        {
          "code": "example_attribute-1",
          "boolean": true,
          "identifier": "my-product-unique-1",
          "locale": "string",
          "longText": "Example of long text.",
          "mediaGallery": [
            "string",
            "string"
          ],
          "multiSelect": [
            "string",
            "string"
          ],
          "number": 104.015,
          "productReference": [
            "string",
            "string"
          ],
          "shortText": "Example of short text.",
          "simpleSelect": "string"
        },
        {
          "code": "example_attribute-1",
          "boolean": true,
          "identifier": "my-product-unique-1",
          "locale": "string",
          "longText": "Example of long text.",
          "mediaGallery": [
            "string",
            "string"
          ],
