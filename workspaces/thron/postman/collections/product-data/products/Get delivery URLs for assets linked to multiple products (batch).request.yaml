$kind: http-request
description: |-
  For each product specified in the request, returns the delivery URLs of the requested assets.

  Use this endpoint when you need to display thumbnails or download links for assets across multiple products at once.

  **Limitations:**

  - Maximum 100 product entries in a single request.
      
  - Maximum 100 asset IDs per product.
      
  - This method is NOT paginated — all results are returned in a single response.
      
  - Only accepts technical product IDs (UUIDs), not identifiers.
url: "{{baseUrl}}/product-data/products/assets"
method: POST
