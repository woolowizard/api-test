$kind: collection
description: |-
  # Product Data API

  Product Data is a PIM API that lets you create, read, update, and delete product information.

  ## Overview

  This API manages **product data** — the structured information that describes items in your catalog.  
  It is designed for system integrators who need to synchronize product information between an external system and this PIM.

  ## Key Concepts

  ### Product

  A **product** is a structured set of attribute values representing a catalog item.  
  Each product is identified by a system-generated UUID (`id`) and one identifier.

  ### Family (Product Schema)

  A **family** is a schema/template that defines which attributes a product can have and their types.  
  Every product belongs to exactly one family.  
  Families are configured in the Data Model service before you can create products.

  ### Attributes (Product Fields)

  Attributes are the data fields on a product. Each attribute has a `code` and a typed value.  
  Supported types:

  - `IDENTIFIER` — unique identifier for the product within its family. Every product must have one.
      
  - `SHORT_TEXT` — short string (max 255 chars).
      
  - `LONG_TEXT` — long string (max 10,000 chars), optionally HTML (depending on attribute definition in data-model).
      
  - `NUMBER` — decimal number
      
  - `BOOLEAN` — true/false flag
      
  - `SIMPLE_SELECT` — single choice from a predefined option list
      
  - `MULTI_SELECT` — multiple choices from a predefined option list
      
  - `MEDIA_GALLERY` — ordered list of digital asset references from the DAM
      
  - `PRODUCT_REFERENCE` — links to other products
      

  **Localization:** Attributes can be localized (one value per locale). A localized attribute stores independent values for each configured language.

  ### Model-Variant Hierarchy

  Products can be standalone or organized in a parent-child hierarchy for items with variants:

  - **SIMPLE** — standalone product, no hierarchy.
      
  - **MASTER** — top-level parent holding shared attributes.
      
  - **VARIATION-GROUP** — optional intermediate level (only when the variation has 2 levels)
      
  - **VARIANT** — the child unit with a unique combination of axis values
      

  Child products automatically **inherit** attribute values from their ancestors.  
  A **variation** schema (configured in the Data Model) defines which attributes belong to which level and which attributes form the **axes** (the differentiating dimensions).

  ### Categories

  Products can be classified into hierarchical catalog category trees. A product may belong to multiple categories across different catalogs.

  ## Authentication

  All endpoints require a Bearer token in the `Authorization` header: `Authorization: Bearer`

  ## Product Identification

  Most endpoints accept a product ID that can be either:

  - A **technical ID** (UUID)
      
  - A **identifier** with format `{attributeCode}:{value}` (case-insensitive on value)
      

  URL-encode identifiers containing `/`, `+`, or spaces.

  ## Permissions

  Endpoints require specific permissions depending on the operation:

  - **Read** (Get, List, Search, GetAssets): `PRODUCT_USER`
      
  - **Write** (Create, Update): `PRODUCT_DATA_EDITOR` or `PRODUCT_MNG`
      
  - **Delete**: `PRODUCT_DATA_REMOVER` or `PRODUCT_MNG`
      
  - **Admin**: `ROLE_ADMINISTRATOR` grants access to all operations
      

  ## Attribute Rights (Access Control on Fields)

  Beyond endpoint-level permissions, each attribute has **per-user access rights** resolved from the user's group memberships.  
  Three levels exist:

  - `CAN_MODIFY` — the attribute is visible and editable
      
  - `CAN_SEE` — the attribute is visible but read-only. Write attempts return HTTP 403.
      
  - `RESTRICTED` — the attribute is completely hidden. It is silently removed from all read responses and cannot be written.
      

  **Key behaviors:**

  - On **read** (Get, List, Search results): `RESTRICTED` attributes are silently omitted from the response. If an attribute is missing, it may be restricted rather than empty.
      
  - On **write** (Create, Update, Partial Update): only `CAN_MODIFY` attributes can be set. Attempting to write `CAN_SEE` or `RESTRICTED` attributes returns HTTP 403.
      
  - On **search criteria**: using a `RESTRICTED` attribute as a filter condition returns HTTP 400.
      

  ## Rate Limiting

  All endpoints are rate-limited. Read and write operations have separate rate limits. When exceeded, the API returns HTTP 429. Retry after a short delay with exponential backoff.

  ## Pagination

  List and Search endpoints use **cursor-based pagination**. The response includes a `next` field containing an opaque cursor token. Pass it as the `cursor` parameter in the next request to get the following page.

  ## Eventual Consistency

  The Search endpoint (`POST /products/_search`) uses an optimized search index. After creating or updating a product, there may be a brief delay (typically < 1 second) before the change appears in search results. The List and Get endpoints always return the latest data.
